<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCode Coach — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #1a1a1a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 20px;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #ffa116;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: #2e2e2e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e5e5e5;
      padding: 9px 40px 9px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #ffa116; }

    #toggle-visibility {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
    }

    #save-btn {
      width: 100%;
      background: #ffa116;
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 10px;
    }

    #save-btn:hover { background: #ffb84d; }
    #save-btn:active { background: #e8900e; }

    #status {
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      color: #4ade80;
    }

    #status.error { color: #f87171; }

    .divider {
      border: none;
      border-top: 1px solid #333;
      margin: 16px 0;
    }

    .info {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .info a {
      color: #ffa116;
      text-decoration: none;
    }

    .info a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🧑‍🏫 Socratic Coach</h1>
  <p class="subtitle">LeetCode AI interview coach</p>

  <label for="api-key-input">Gemini API Key</label>
  <div class="input-wrapper">
    <input type="password" id="api-key-input" placeholder="AIza..." autocomplete="off" spellcheck="false" />
    <button id="toggle-visibility" title="Show/hide key">👁</button>
  </div>

  <button id="save-btn">Save Key</button>
  <div id="status"></div>

  <hr class="divider" />

  <p class="info">
    Get a free API key at
    <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.
    Your key is stored locally in Chrome and never leaves your browser.
  </p>

  <script src="popup.js"></script>
</body>
</html>
